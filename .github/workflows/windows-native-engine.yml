name: Windows Native Composition Engine
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version for the engine archives'
        required: true
        type: string
        default: '3.41.10-ohos-0.0.2-beta.operit.8'
      publish:
        description: 'Publish artifacts from a matching release tag'
        required: true
        default: false
        type: boolean
      build_run:
        description: 'Promote an already successful run without rebuilding'
        required: false
        default: ''
        type: string
permissions:
  actions: read
  contents: write
jobs:
  build:
    if: inputs.build_run == ''
    runs-on: windows-2022
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, profile, release]
    steps:
      - uses: actions/checkout@v4
        with:
          path: flutter
          ref: ${{ github.sha }}
      - name: Check release source identity
        if: inputs.publish
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ('${{ github.ref }}' -ne "refs/tags/$env:RELEASE_TAG") {
            throw 'Publishing requires dispatching from the matching release tag.'
          }
      - name: Install depot tools
        shell: pwsh
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$env:RUNNER_TEMP/depot_tools"
          "$env:RUNNER_TEMP/depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Synchronize engine dependencies
        working-directory: flutter
        shell: pwsh
        env:
          DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
          GYP_MSVS_VERSION: '2022'
        run: |
          git config --global core.longpaths true
          Copy-Item engine/scripts/standard.gclient .gclient
          (Get-Content .gclient -Raw).Replace('https://github.com/flutter/flutter.git', 'https://github.com/AAswordman/flutter-ohos.git') | Set-Content .gclient
          gclient sync --no-history
          if ($LASTEXITCODE) { throw 'Dependency synchronization failed.' }
      - name: Build and test native engine
        working-directory: flutter
        shell: pwsh
        run: |
          ./tools/build_windows_native_engine.ps1 -Mode '${{ matrix.mode }}' -Version '${{ inputs.release_tag }}' -RunTests:('${{ matrix.mode }}' -eq 'debug')
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-${{ matrix.mode }}
          path: flutter/engine/src/out/host_${{ matrix.mode }}/windows-x64-${{ matrix.mode }}.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && matrix.mode == 'debug'
        with:
          name: windows-x64-test-results
          path: flutter/engine/src/out/host_debug/*-unit-tests.xml
          if-no-files-found: ignore
  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-x64-*
          path: release-assets
          merge-multiple: true
      - name: Publish matching Flutter and engine release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Flutter ${{ inputs.release_tag }} with Windows native composition
          generate_release_notes: true
          files: release-assets/*.zip
  promote:
    if: inputs.build_run != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: ${{ inputs.build_run }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tested source identity
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > build-run.json
          python3 - <<'PY'
          import json, os, subprocess
          run = json.load(open('build-run.json'))
          assert run['name'] == 'Windows Native Composition Engine', run['name']
          assert run['status'] == 'completed' and run['conclusion'] == 'success'
          tag = os.environ['RELEASE_TAG']
          revision = subprocess.check_output(
              ['git', 'rev-parse', f'refs/tags/{tag}^{{commit}}'], text=True).strip()
          assert run['head_sha'] == revision, (run['head_sha'], revision)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'SOURCE_REVISION={revision}\n')
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run }}
          pattern: windows-x64-*
          merge-multiple: true
          path: release-assets
      - name: Verify archives and native test reports
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/verify_windows_engine_release.py release-assets "$SOURCE_REVISION" "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-verification
          path: |
            release-assets/release-manifest.json
            release-assets/SHA256SUMS
            release-assets/*-unit-tests.xml
      - name: Publish verified archives
        shell: bash
        run: |
          set -euo pipefail
          git show "$SOURCE_REVISION:docs/engine/operit-8-release.md" > release-notes.md
          cat >> release-notes.md <<EOF

          ## Completed native build verification

          - Windows x64 Debug, Profile and Release builds succeeded.
          - Shared C++ suite: 234 passed; Windows focused suite: 49 passed.
          - All five new plugin regressions and the engine tooltip regression passed.
          - Every archived file matches its manifest SHA-256; all archives identify
            tested source revision \`$SOURCE_REVISION\` and the retained compiler ABI.
          - Build: https://github.com/$GH_REPO/actions/runs/$BUILD_RUN
          - Interactive Operit application replay has not been performed.
          EOF
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "$RELEASE_TAG" --notes-file release-notes.md
          gh release upload "$RELEASE_TAG" release-assets/windows-x64-{debug,profile,release}.zip \
            release-assets/release-manifest.json release-assets/SHA256SUMS \
            release-assets/common-unit-tests.xml release-assets/windows-unit-tests.xml
          gh release edit "$RELEASE_TAG" --draft=false --latest
